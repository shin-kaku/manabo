      const scheme = matchMedia('(prefers-color-scheme: dark)');
      const syncTheme = () => {
        let saved;

      };
      syncTheme();
      scheme.addEventListener('change', syncTheme);
      window.addEventListener('storage', syncTheme);
    }

      .reveal::backdrop,.reveal[data-phase="closing"]::backdrop,.reveal[data-phase="opening"] .close{animation:none}
      .close{transition:none}
    }

.star-sidebar {
  position: relative; z-index: 2; align-self: start; min-width: 0;
  padding: 17px 15px; border: 1px solid var(--line); border-radius: var(--radius, 12px);
  background: var(--paper); color: var(--ink); box-shadow: 0 2px 6px rgb(0 0 0 / .04);
  font: 14px/1.5 var(--ko);
}
.star-search { position: relative; }
.star-search label { display: block; margin-bottom: 7px; font-weight: 650; }
.star-search-field { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; }
.star-search-field:focus-within { border-color: var(--accent); }
.star-search-field input {
  flex: 1; min-width: 0; width: 100%; height: 42px; margin: 0; padding: 0 0 0 11px;
  border: 0; border-radius: inherit; outline: none; background: transparent; color: var(--ink); font: 16px var(--ko);
}
.star-search-field input:focus-visible { outline: none; }
.star-search-field button { display: grid; place-content: center; flex: none; width: 42px; height: 42px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); }
.star-search-field button:hover { color: var(--ink); }
.star-search-icon { position: relative; width: 14px; height: 14px; border: 1.6px solid currentColor; border-radius: 50%; }
.star-search-icon::after { content: ""; position: absolute; left: 10px; top: 10px; width: 6px; height: 1.6px; background: currentColor; transform-origin: left; transform: rotate(45deg); }
.star-suggestions {
  position: absolute; z-index: 1; inset: calc(100% + 5px) 0 auto; overflow-y: auto; overscroll-behavior: contain;
  max-height: min(240px, 32dvh); padding: 3px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--paper); box-shadow: 0 6px 20px rgb(0 0 0 / .13);
}
.star-suggestions ul { list-style: none; margin: 0; padding: 0; }
.star-suggestions li { display: flex; align-items: center; gap: 9px; min-height: 40px; padding: 4px 8px; border-radius: 5px; cursor: pointer; }
.star-suggestions li[aria-selected="true"], .star-suggestions li:hover { background: var(--bg); }
.star-suggestions [lang="ja"] { color: var(--ink); font: 22px/1 var(--ja); }
.star-suggestions .star-empty { margin: 6px; color: var(--muted); }
.board-key { margin-top: 15px; border-top: 1px solid var(--line); padding-top: 13px; color: var(--muted); }
.board-key .location, .board-key li { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.board-key .location { color: var(--ink); font-weight: 600; }
.board-key ul { list-style: none; padding: 0; margin: 9px 0 0; display: grid; gap: 8px; }
.board-key i { position: relative; display: inline-block; width: 16px; flex: none; }
.star-help { margin: 13px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; word-break: keep-all; }
.standalone .learning-action { color: var(--accent); font-weight: 700; }
.key-relation { height: 2px; }
.key-relation::before {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(circle at 1px 50%, var(--end-dot) 0 .8px, transparent 1.1px) 0 0 / 4px 2px repeat-x;
  -webkit-mask-image: linear-gradient(to right, transparent, black);
  mask-image: linear-gradient(to right, transparent, black);
}
.key-relation::after {
  content: ""; position: absolute; right: 0; top: 50%; transform: translateY(-50%);
  width: 5px; height: 5px; border-radius: 50%; background: var(--end-dot);
}
.board-key .key-current, .board-key .key-cell {
  width: 13px; height: 13px; flex: none; border: 1px solid var(--key-edge); background: var(--paper);
  box-shadow: 0 1px 3px rgb(0 0 0 / .14);
}
.key-current { border-radius: 2px; }
.key-cell { border-radius: 50%; }
.stage { perspective: 900px; touch-action: pan-y pinch-zoom; }
#card {
  --x: 37%;
  --y: 28%;
  --turn-x: 0deg;
  --turn-y: 0deg;
  transform: rotateX(var(--turn-x)) rotateY(var(--turn-y));
  transition: transform 180ms ease-out;
}
#card[data-active] { transition-duration: 60ms; }
.artwork::before,
.artwork::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.artwork::before {
  background-image:
    radial-gradient(ellipse 55% 58% at calc(var(--x) - 20%) var(--y), rgb(120 210 220 / .72), transparent 100%),
    radial-gradient(ellipse 50% 55% at calc(var(--x) + 20%) var(--y), rgb(210 146 202 / .70), transparent 100%);
  opacity: .38;
}
.artwork::after {
  background: radial-gradient(ellipse at var(--x) var(--y), rgb(255 255 242 / .24), transparent 42%);
}
#card[data-active] .artwork::before { opacity: .62; }
@media (prefers-reduced-motion: reduce) {
  #card { transform: none; transition: none; }

  const canvas = board.querySelector('canvas');

    }

      phase: i * 2.1, speed: 2 * Math.PI / (5300 + i * 430)}));

    const stem = link(center, fork, true);

    for (const branch of [...outward, ...inward]) {
      branch.selection = selection([branch, ...branch.parents], branch.far);
      nodeSelections.set(branch.far, branch.selection);
    }
    stem.selection = selection([stem, ...inward]);
    nodeSelections.set(center, selection(links, center));
    idleRoutes = [];
    for (let i = 0; i < Math.max(outward.length, inward.length); i++) {
      if (outward[i]) idleRoutes.push(outward[i].selection.route);
      if (inward[i]) idleRoutes.push(inward[i].selection.route);
    }
    idleStep = idleRoutes.length > 1 ? travelTime * .8 : travelTime + rippleTime;

    lastFrame = null;

  function updateGlyphs() {
    for (const {key, glyph, phase, speed} of floaters) {
      const p = points.get(key);
      const amplitude = Math.min(p.radius * .15, 5);
      const dx = reducedMotion.matches ? 0 : amplitude * .62 * Math.cos(elapsed * speed * .78 + phase);
      const dy = reducedMotion.matches ? 0 : amplitude * Math.sin(elapsed * speed + phase);

      p.y = p.baseY + dy;

    }

  function positionLinks(root) {
    if (componentKeys.length) {
      const start = root.y + root.radius;
      const top = Math.min(...componentKeys.map(key => points.get(key).y - points.get(key).radius));
      Object.assign(points.get(fork), {x: root.x, y: start + (top - start) * .44});

    if (head < length + tail && length > 0) {
      const gradient = ctx.createLinearGradient(head - tail, 0, head, 0);
      gradient.addColorStop(0, 'rgba(255,255,255,0)');
      gradient.addColorStop(.7, 'rgba(255,255,255,.8)');

      dot(head, 2.65, '#fff');
    } else if (link.near !== fork) {
      // The shared joint is not a kanji. A ripple lands only at a node.
      const t = arrival / rippleTime;
      ctx.globalAlpha = link.opacity * (1 - t) * .95;
      ctx.beginPath();

    const {start, span} = routeBounds(route);

  function visibleLights() {
    if (reducedMotion.matches || !idleRoutes.length) return [];

    const age = elapsed - index * idleStep;
    // Pointer and keyboard focus affect brightness only. Every route keeps its place on the same clock.
    const lights = [signal(idleRoutes[index % idleRoutes.length], age)];
    if (index > 0 && idleRoutes.length > 1 && age + idleStep < travelTime + rippleTime) {
      lights.push(signal(idleRoutes[(index - 1) % idleRoutes.length], age + idleStep));

  }



  function paint() {
    const root = points.get(rootKey);

  let bounds;
  let pointer;
  let x = .37, y = .28;

  function rest() {
    cancelAnimationFrame(frame);
    frame = 0;
    bounds = undefined;
    pointer = undefined;
    x = .37;
    y = .28;
    card.removeAttribute('data-active');
    for (const key of ['--x','--y','--turn-x','--turn-y']) card.style.removeProperty(key);
  }

  function illuminate(nextX, nextY) {
    if (dialog.dataset.phase !== 'open') return;
    x = Math.max(0, Math.min(1, nextX));
    y = Math.max(0, Math.min(1, nextY));
    if (frame) return;
    frame = requestAnimationFrame(() => {
      frame = 0;
      card.setAttribute('data-active', '');
      card.style.setProperty('--x', (x * 100).toFixed(1) + '%');
      card.style.setProperty('--y', (y * 100).toFixed(1) + '%');
      if (!reduceMotion.matches) {
        card.style.setProperty('--turn-x', ((.5 - y) * 10).toFixed(1) + 'deg');
        card.style.setProperty('--turn-y', ((x - .5) * 13).toFixed(1) + 'deg');
      }
    });
  }

  function lightAtPointer() {
    if (!pointer || dialog.dataset.phase !== 'open') return;
    bounds ??= surface.getBoundingClientRect();
    illuminate((pointer.x - bounds.left) / bounds.width, (pointer.y - bounds.top) / bounds.height);
  }

  function point(event) {
    pointer = {x: event.clientX, y: event.clientY};
    lightAtPointer();
  }

  surface.addEventListener('pointerenter', point);
  surface.addEventListener('pointerdown', point);
  surface.addEventListener('pointermove', point, { passive: true });
  surface.addEventListener('pointerleave', rest);
  surface.addEventListener('pointercancel', rest);
  surface.addEventListener('pointerup', event => { if (event.pointerType !== 'mouse') rest(); });
  dialog.addEventListener('cardopened', lightAtPointer);
  window.addEventListener('resize', rest);
  window.addEventListener('scroll', () => { bounds = undefined; }, { passive: true });
  card.addEventListener('blur', rest);
  dialog.addEventListener('close', rest);
  card.addEventListener('keydown', event => {
    const directions = { ArrowLeft: [-.15, 0], ArrowRight: [.15, 0], ArrowUp: [0, -.15], ArrowDown: [0, .15] };
    const direction = directions[event.key];
    if (!direction) return;
    event.preventDefault();
    illuminate(x + direction[0], y + direction[1]);
  });
  reduceMotion.addEventListener('change', rest);
})();
</script>
</body>
</html>
