<title id="name">犬 · 먹 획순 애니메이션</title>
<desc id="desc">기존에 표시된 방향을 따라 각 획의 먹면을 차례로 드러냅니다. 애니메이션이 끝나면 잠시 쉬고 다시 시작합니다.</desc>
