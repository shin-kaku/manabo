<title id="name">見 · 먹 획순 애니메이션</title>
<desc id="desc">빨간 번호 1부터 7까지 각 획의 시작 위치를 표시하고 번호순으로 획을 그립니다. 애니메이션이 끝나면 잠시 쉬고 다시 시작합니다.</desc>
