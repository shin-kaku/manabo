name: Validate Manabo

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    # Production sync performs these same checks after restoring Google media.
    if: github.event_name != 'push' || github.ref != 'refs/heads/master' || vars.MEDIA_SYNC_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/cache@v4
        with:
          path: public/media
          key: media-v1-${{ hashFiles('public/data/media.json') }}
          restore-keys: media-v1-
      - run: npm run build
